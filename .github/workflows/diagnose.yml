name: Diagnose

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Run JVM briefly (headless)
        continue-on-error: true
        shell: bash
        run: |
          timeout 90s xvfb-run -a ./gradlew --no-daemon runJvm 2>&1 | tail -200
