name: Diagnose

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Build release APK
        continue-on-error: true
        run: ./gradlew --no-daemon assembleRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease

      - name: List APK assets
        continue-on-error: true
        shell: bash
        run: |
          APK=$(find build/outputs/apk/release -name '*.apk' -type f | head -n1)
          echo "APK=$APK"
          unzip -l "$APK" | grep -iE 'assets|\.png' | head -100

      - name: Run JVM build briefly (headless)
        continue-on-error: true
        shell: bash
        run: |
          timeout 90s xvfb-run -a ./gradlew --no-daemon runJvm 2>&1 | tail -200
