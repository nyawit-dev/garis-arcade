name: Diagnose

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Download published APK
        run: |
          curl -sL -o app.apk "https://github.com/nyawit-dev/garis-arcade/releases/download/v0.4.0/garis-arcade-v0.4.0.apk"
          ls -lh app.apk

      - name: List packaged assets
        run: |
          unzip -l app.apk | grep -iE 'assets|\.png' | head -120

      - name: Dump manifest
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | head -n1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | head -n1)
          echo "AAPT=$AAPT"
          "$AAPT" dump badging app.apk 2>&1 | head -40
